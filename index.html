<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEX Short</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #08080c, #171329);
    color: white;
    display: flex;
    justify-content: center;
}

.container {
    width: 92%;
    max-width: 500px;
    margin-top: 70px;
}

.logo {
    text-align: center;
    margin-bottom: 30px;
}

.logo h1 {
    font-size: 38px;
    margin: 0;
}

.logo span {
    color: #8b7cff;
}

.logo p {
    color: #999;
}

.card {
    background: rgba(30,30,40,.95);
    padding: 22px;
    border-radius: 18px;
    box-shadow: 0 15px 40px #0008;
}

input {
    width: 100%;
    padding: 16px;
    border: 0;
    outline: none;
    border-radius: 12px;
    background: #292936;
    color: white;
    font-size: 16px;
}

input::placeholder {
    color: #888;
}

button {
    width: 100%;
    padding: 16px;
    margin-top: 12px;
    border: 0;
    border-radius: 12px;
    background: #7565ff;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(.98);
}

#resultado {
    display: none;
    margin-top: 18px;
    padding: 15px;
    border-radius: 12px;
    background: #242431;
}

#linkCurto {
    color: #a99fff;
    word-break: break-all;
    font-size: 15px;
}

#copiar {
    background: #343442;
}

.history {
    margin-top: 25px;
}

.history h2 {
    font-size: 20px;
}

.item {
    background: #242431;
    padding: 13px;
    margin-top: 10px;
    border-radius: 12px;
}

.original {
    color: #999;
    font-size: 13px;
    word-break: break-all;
}

.short {
    color: #a99fff;
    margin-top: 6px;
    font-size: 14px;
    word-break: break-all;
}

.empty {
    color: #777;
    text-align: center;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <h1>🔗 NEX <span>Short</span></h1>
        <p>Encurte seus links rapidamente</p>
    </div>

    <div class="card">

        <input
            id="url"
            type="url"
            placeholder="https://exemplo.com"
        >

        <button onclick="encurtar()">
            ✂️ ENCURTAR LINK
        </button>

        <div id="resultado">

            <div id="linkCurto"></div>

            <button id="copiar" onclick="copiarLink()">
                📋 COPIAR
            </button>

        </div>

    </div>

    <div class="history">

        <h2>🕘 Histórico</h2>

        <div id="historico"></div>

    </div>

</div>

<script>

let linkAtual = "";

function encurtar() {

    const campo =
        document.getElementById("url");

    const url =
        campo.value.trim();

    if (!url) {
        alert("Cole um link primeiro!");
        return;
    }

    try {
        new URL(url);
    } catch {
        alert("Digite uma URL válida!");
        return;
    }

    const codigo =
        Math.random()
        .toString(36)
        .substring(2, 8);

    linkAtual =
        window.location.origin +
        window.location.pathname +
        "?s=" +
        codigo;

    document.getElementById("linkCurto")
        .textContent = linkAtual;

    document.getElementById("resultado")
        .style.display = "block";

    salvar(url, linkAtual);

    campo.value = "";

    mostrarHistorico();
}

function salvar(original, curto) {

    let lista =
        JSON.parse(
            localStorage.getItem("nexLinks") || "[]"
        );

    lista.unshift({
        original: original,
        curto: curto
    });

    lista =
        lista.slice(0, 10);

    localStorage.setItem(
        "nexLinks",
        JSON.stringify(lista)
    );
}

function mostrarHistorico() {

    const area =
        document.getElementById("historico");

    const lista =
        JSON.parse(
            localStorage.getItem("nexLinks") || "[]"
        );

    if (lista.length === 0) {

        area.innerHTML =
            "<p class='empty'>Nenhum link criado ainda.</p>";

        return;
    }

    area.innerHTML = "";

    lista.forEach(function(item) {

        const div =
            document.createElement("div");

        div.className = "item";

        div.innerHTML =
            "<div class='original'>" +
            escapar(item.original) +
            "</div>" +

            "<div class='short'>" +
            escapar(item.curto) +
            "</div>";

        area.appendChild(div);
    });
}

function escapar(texto) {

    return texto
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
}

async function copiarLink() {

    try {

        await navigator.clipboard
            .writeText(linkAtual);

        alert("Link copiado! 📋");

    } catch {

        alert("Não foi possível copiar.");
    }
}

mostrarHistorico();

</script>

</body>
</html>
